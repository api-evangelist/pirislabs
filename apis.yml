aid: pirislabs
name: Piris Labs
description: >-
  Piris Labs is a Y Combinator (W2026) deep-tech startup building the networking
  layer for AI. The company develops proprietary photonic interconnect
  technology paired with a vertically optimized software stack that moves data
  between AI accelerators at ultra-low latency, targeting the bottleneck where up
  to 80% of advanced AI compute sits idle waiting on slow networking. Piris Labs
  couples this optical fabric with a full-stack, low-latency inference offering
  and has reported some of the fastest inference speeds for large frontier
  models. Founded in San Francisco by Ali Khalatpour (CEO) and Keyvan Moghadam
  (President), the company currently exposes no public, documented developer API
  or SDK — its product is delivered as hardware plus a hosted inference stack
  behind an early-access waitlist. This profile tracks Piris Labs' identity in
  the API Evangelist network and any future API surface it publishes.
